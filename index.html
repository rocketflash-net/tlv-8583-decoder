<style>
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#151a28; --slate:#5a6275; --line:#e1e4ee;
  --cobalt:#2b45d4; --cobalt-wash:#eaedfc;
  --code-bg:#151a28; --code-ink:#d9def0; --code-key:#9db0ff; --code-num:#ffc58a; --code-dim:#6d7591; --code-sub:#9be3b8;
  --ok:#1f9d63; --ok-wash:#e3f6ec; --warn:#b26a00; --warn-wash:#fff3dc; --err:#c8323c; --err-wash:#fde8ea;
  --max:72rem; --gutter:clamp(1rem,4vw,2.5rem);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1220; --surface:#131a2c; --ink:#e7eaf3; --slate:#98a0b6; --line:#232b42;
    --cobalt:#8fa2ff; --cobalt-wash:#1a2246; --code-bg:#070a14;
    --ok:#3ccf8e; --ok-wash:#0f2a20; --warn:#ffb547; --warn-wash:#2c2210; --err:#ff6b74; --err-wash:#2e1418;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1220; --surface:#131a2c; --ink:#e7eaf3; --slate:#98a0b6; --line:#232b42;
  --cobalt:#8fa2ff; --cobalt-wash:#1a2246; --code-bg:#070a14;
  --ok:#3ccf8e; --ok-wash:#0f2a20; --warn:#ffb547; --warn-wash:#2c2210; --err:#ff6b74; --err-wash:#2e1418;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.6 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cobalt);text-underline-offset:3px}
a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.25rem 0;font-size:.95rem}
.bar .home{color:var(--ink);text-decoration:none;font-weight:600}
.bar .right{display:flex;gap:.6rem;align-items:center}
.bar .right a{color:var(--slate);text-decoration:none;margin-right:.6rem}
.bar .right a:hover{color:var(--ink)}
.toggle{background:var(--surface);border:1px solid var(--line);color:var(--ink);height:2.1rem;min-width:2.1rem;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{background:none;border:0;color:var(--slate);font:600 .8rem/1 "Schibsted Grotesk",sans-serif;padding:.6rem .7rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
:root[data-theme="dark"] .lang button[aria-pressed="true"]{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lang button[aria-pressed="true"]{color:#0d1220}}

header.top{padding:clamp(1.5rem,5vw,3.5rem) 0 clamp(1.5rem,4vw,2.25rem)}
h1{font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.02;letter-spacing:-.035em;font-weight:800}
h1 span{color:var(--cobalt)}
.lede{color:var(--slate);margin-top:.9rem;max-width:42rem;font-size:1.06rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.input{padding:1rem}
.input label.main{display:block;font-weight:600;font-size:.92rem;margin:0 0 .5rem .2rem}
textarea{width:100%;min-height:7.5rem;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:400 .9rem/1.6 "IBM Plex Mono",ui-monospace,monospace;padding:.8rem .9rem;word-break:break-all}
textarea:focus{border-color:var(--cobalt)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.75rem}
.btn{display:inline-flex;align-items:center;padding:.55rem 1rem;border-radius:8px;font:600 .9rem/1.2 "Schibsted Grotesk",sans-serif;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer}
.btn:hover{border-color:var(--cobalt)}
.btn.solid{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
:root[data-theme="dark"] .btn.solid{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.solid{color:#0d1220}}
.opt{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--slate);font-weight:500}
.opt select,.opt input{font:500 .85rem/1.2 "Schibsted Grotesk",sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .55rem}
.opt input{width:5.2rem;font-family:"IBM Plex Mono",monospace}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:.45rem;font-weight:600;font-size:.9rem;padding:.4rem .8rem;border-radius:999px}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok);background:var(--ok-wash)}
.status.err{color:var(--err);background:var(--err-wash)}
.status.warn{color:var(--warn);background:var(--warn-wash)}
.status[hidden]{display:none}

#out[hidden]{display:none}
.summary{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:1.25rem}
.summary div{flex:1 1 10.5rem;background:var(--surface);padding:.85rem 1rem}
.summary dt{color:var(--slate);font-size:.8rem;font-weight:500}
.summary dd{font-weight:700;font-size:1.05rem;margin-top:.1rem;overflow-wrap:anywhere}
.summary dd small{display:block;font-weight:500;font-size:.8rem;color:var(--slate)}

.raw{background:var(--code-bg);color:var(--code-ink);border-radius:14px;margin-top:1.25rem;overflow:hidden}
.raw-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 1rem;padding:.75rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);font-size:.8rem;color:var(--code-dim)}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem}
.legend i{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.35rem;vertical-align:-.02rem}
.raw pre{padding:1rem 1.1rem 1.15rem;white-space:pre-wrap;word-break:break-all;font:400 .92rem/1.85 "IBM Plex Mono",ui-monospace,monospace}
.raw .t{color:var(--code-key);font-weight:500}
.raw .l{color:var(--code-num)}
.raw .v1{color:var(--code-sub)}
.raw .seg{border-radius:3px;transition:background .12s;cursor:pointer}
.raw .seg.hl{background:rgba(157,176,255,.2)}
.raw .bad{color:#ff8a92;text-decoration:underline wavy;text-underline-offset:4px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:1.25rem;margin-top:1.25rem;align-items:start}
h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;padding:1rem 1.1rem .85rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem 1rem}
h2 .tools{display:flex;gap:.4rem}
h2 .btn{padding:.35rem .7rem;font-size:.82rem}
h2 .btn[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt)}

.json{background:var(--code-bg);color:var(--code-ink);margin:0;border-radius:0 0 13px 13px;padding:1rem 1.1rem 1.15rem;font:400 .88rem/1.75 "IBM Plex Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:36rem;overflow:auto}
.json .k{color:var(--code-key)}
.json .s{color:var(--code-sub)}
.json .n{color:var(--code-num)}
.json .p{color:var(--code-dim)}

.fields{margin-top:1.25rem}
.rows{list-style:none}
.row,.thead{display:grid;grid-template-columns:4.8rem minmax(0,1fr) minmax(0,1.2fr) 2.6rem;gap:.35rem 1rem;padding:.8rem 1.1rem;align-items:baseline}
.row{border-bottom:1px solid var(--line);transition:background .12s}
.row:last-child{border-bottom:0}
.row.hl{background:var(--cobalt-wash)}
.row .tag{font:500 .9rem "IBM Plex Mono",monospace;color:var(--cobalt)}
.row .name{font-weight:600;font-size:.95rem;line-height:1.35}
.row .fmt{display:block;color:var(--slate);font:400 .78rem/1.4 "IBM Plex Mono",monospace;margin-top:.2rem}
.row .key{display:block;color:var(--slate);font:400 .78rem/1.4 "IBM Plex Mono",monospace}
.row .meaning{display:block;margin-top:.35rem;font:500 .86rem/1.45 "Schibsted Grotesk",sans-serif;color:var(--ink)}
.row .meaning::before{content:"→ ";color:var(--cobalt)}
.row .val{font:400 .88rem/1.5 "IBM Plex Mono",monospace;overflow-wrap:anywhere;white-space:pre-wrap}
.row .len{font:400 .82rem "IBM Plex Mono",monospace;color:var(--slate);text-align:right}
.row.child{padding-left:calc(1.1rem + var(--d,1) * 1rem);background:color-mix(in srgb,var(--paper) 55%,transparent)}
.row.child.hl{background:var(--cobalt-wash)}
.row.child .tag{color:var(--slate)}
.row.flag .val{color:var(--err)}
.thead{border-bottom:1px solid var(--line);padding-top:.55rem;padding-bottom:.55rem;font-size:.78rem;color:var(--slate);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.thead span:last-child{text-align:right}

.checks{list-style:none;padding:.4rem 0}
.checks li{display:grid;grid-template-columns:1.2rem 1fr;gap:.5rem;padding:.5rem 1.1rem;font-size:.9rem;line-height:1.45;overflow-wrap:anywhere}
.checks li::before{font-weight:700;text-align:center}
.checks .ok::before{content:"✓";color:var(--ok)}
.checks .warn::before{content:"!";color:var(--warn)}
.checks .err::before{content:"✕";color:var(--err)}
.checks .info::before{content:"i";color:var(--cobalt)}
.about{padding:1rem 1.1rem;color:var(--slate);font-size:.86rem;line-height:1.55;border-top:1px solid var(--line)}
.about p+p{margin-top:.6rem}

.empty{margin-top:1.25rem;padding:2rem 1.25rem;text-align:center;color:var(--slate);border:1px dashed var(--line);border-radius:14px}
footer{padding:2.5rem 0 3rem;color:var(--slate);font-size:.9rem}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
}
@media (max-width:600px){
  .bar .right a{display:none}
  .status{margin-left:0;width:100%;justify-content:center}
  .thead{display:none}
  .row{grid-template-columns:3.8rem minmax(0,1fr) auto;padding:.8rem .9rem}
  .row .val{grid-column:2 / 4}
  .row .len{grid-row:1;grid-column:3}
  .row.child{padding-left:calc(.9rem + var(--d,1) * .5rem)}
}
@media (prefers-reduced-motion:reduce){.row,.raw .seg{transition:none}}
</style>
</head>

<div class="wrap">

    <div class="grid2">

        <pre class="json" id="json"></pre>
      </div>
      <aside class="card side">
        <h2 data-t="checks"></h2>
        <ul class="checks" id="checks"></ul>
        <div class="about"><p data-t="privacy"></p><p data-t="ref"></p></div>
      </aside>
    </div>

    <div class="card fields">
      <h2 data-t="decoded"></h2>
      <div class="thead"><span>DE</span><span data-t="colField"></span><span data-t="colValue"></span><span data-t="colLen"></span></div>
      <ul class="rows" id="rows"></ul>
    </div>
  </div>
</div>

          break;
        case 'de43':
          if (v.length === 40){
            var nm = v.slice(0, 25), ct = v.slice(25, 38), cn = v.slice(38, 40);
            add('merchantName', nm.trim(), w); add('merchantCity', ct.trim(), w + .001); add('merchantCountry', cn, w + .002);
            kids.push({tag:'43.1', name:L('Merchant name','Nama merchant'), key:'merchantName', fmt:'ans 25', value: nm, len: 25});
            kids.push({tag:'43.2', name:L('Merchant city','Kota merchant'), key:'merchantCity', fmt:'ans 13', value: ct, len: 13});
            kids.push({tag:'43.3', name:L('Country code','Kode negara'), key:'merchantCountry', fmt:'a 2', value: cn, len: 2});
          } else add(sp.key, v, w);
          break;
        case 'tlv48':
          var t48 = tlv(v, /^[A-Z0-9]{2}$/);
          if (t48){
            t48.forEach(function(t, j){
              var m = T48[t.tag], key = m ? m[0] : 'de48' + t.tag, val = m && m[2] ? t.value.trim() : t.value;
              add(key, val, w + j * .001);
              kids.push({tag:'48.' + t.tag, name: m ? m[1] : L('Tag ' + t.tag, 'Tag ' + t.tag), key: key, fmt: 'TLV', value: t.value, len: t.len,
                meaning: t.tag === 'MC' && CRITERIA[t.value] ? tr(CRITERIA[t.value]) : null});
            });
          } else { add(sp.key, v, w); extra.push(['warn', 'DE48 is not valid TLV (2-character tag + 2-digit length); shown raw.', 'DE48 bukan TLV yang valid (tag 2 karakter + panjang 2 digit); ditampilkan mentah.']); }
          break;
        case 'tlv57':
          var t57 = tlv(v, /^\d{2}$/);
          if (t57){
            t57.forEach(function(t, j){
              var m = T57[t.tag], key = m ? m[0] : 'de57Tag' + t.tag;
              add(key, t.value, t.tag === '62' ? 102.5 : w + j * .001);
              var kid = {tag:'57.' + t.tag, name: m ? m[1] : L('Tag ' + t.tag, 'Tag ' + t.tag), key: key, fmt: 'TLV', value: t.value, len: t.len, sub: []};
              if (t.tag === '62'){
                var t62 = tlv(t.value, /^\d{2}$/);
                if (t62) t62.forEach(function(x){
                  var n = +x.tag;
                  kid.sub.push({tag:'57.62.' + x.tag, name: T62[x.tag] || (n >= 50 ? L('Payment system specific','Khusus sistem pembayaran') : L('RFU','RFU')), fmt:'TLV', value: x.value, len: x.len, d: 2});
                });
              }
              kids.push(kid);
            });
          } else { add(sp.key, v, w); extra.push(['warn', 'DE57 is not valid TLV (2-digit tag + 2-digit length); shown raw.', 'DE57 bukan TLV yang valid (tag 2 digit + panjang 2 digit); ditampilkan mentah.']); }
          break;
        case 'de90':
          add(sp.key, v, w);
          if (/^\d{42}$/.test(v)){
            [['90.1',0,4,L('Original MTI','MTI asli')],['90.2',4,6,L('Original STAN','STAN asli')],['90.3',10,10,L('Original transmission date/time','Tanggal/jam transmisi asli')],['90.4',20,11,L('Original acquirer ID','ID acquirer asli')],['90.5',31,11,L('Original forwarding ID','ID penerus asli')]]
              .forEach(function(x){ kids.push({tag:x[0], name:x[3], fmt:'n ' + x[2], value: v.substr(x[1], x[2]), len: x[2]}); });
          }
          break;
        default: add(sp.key, v, w);
      }
      rows.push({i: idx, tag: String(sp.de), name: sp.name, key: entries.length && sp.kind !== 'de43' && sp.kind !== 'tlv48' && sp.kind !== 'tlv57' ? entries[entries.length - 1].k : null,
        fmt: fmtLabel(sp), value: (sp.var ? f.pre + ' ' : '') + v, rawValue: v, len: v.length, meaning: meaning, flag: f.flag, kids: kids});
    });

    entries.forEach(function(e, j){ e.seq = j; });
    entries.sort(function(a, b){ return a.w - b.w || a.seq - b.seq; });
    return {entries: entries, rows: rows, extra: extra, get: get, cur: cur};
  }

  // ---------- JSON output ----------
  var pretty = false;
  function serialize(entries, html){
    var nl = pretty ? '\n' : '', ind = pretty ? '  ' : '', sp = pretty ? ' ' : '';
    var P = function(t){ return html ? '<span class="p">' + t + '</span>' : t; };
    var out = P('{') + nl;
    entries.forEach(function(e, j){
      var k = JSON.stringify(e.k), v = e.raw ? e.v : JSON.stringify(e.v);
      out += ind + (html ? '<span class="k">' + esc(k) + '</span>' : k) + P(':') + sp +
        (html ? '<span class="' + (e.raw ? 'n' : 's') + '">' + esc(v) + '</span>' : v) + (j < entries.length - 1 ? P(',') : '') + nl;
    });
    return out + P('}');
  }

  // ---------- Render ----------
  var q = $('q'), current = null;
  function render(){
    // Drop line breaks and leading whitespace only; inner spaces are part of fixed-width fields.
    var raw = q.value.replace(/^[\s﻿]+/, '').replace(/[\r\n]+/g, '');
    var y = $('year').value.trim();
    yearOverride = /^\d{4}$/.test(y) ? +y : null;
    var st = $('status');
    if (!raw){ $('out').hidden = true; $('empty').hidden = false; st.hidden = true; current = null; return; }
    var profile = $('profile').value;
    var p = parse(raw, profile), d = decode(p, profile);
    d.extra.forEach(function(x){ p.checks.push({lv: x[0], msg: L(x[1], x[2])}); });
    if (yearUsed && !yearOverride) p.checks.push({lv:'info', msg: L('Dates carry no year in ISO 8583; ' + yearUsed + ' was picked as the closest to today. Set Year to override.', 'Tanggal di ISO 8583 tidak membawa tahun; dipilih ' + yearUsed + ' sebagai yang terdekat dengan hari ini. Isi Tahun untuk mengganti.')});
    var rc = d.get(39);
    if (rc) p.checks.push({lv: rc.value === '00' ? 'ok' : 'warn', msg: L('Response code ' + rc.value + (RC[rc.value] ? ': ' + RC[rc.value].en : '') + '.', 'Kode respons ' + rc.value + (RC[rc.value] ? ': ' + RC[rc.value].id : '') + '.')});
    current = {p: p, d: d};

    var hasErr = p.checks.some(function(c){ return c.lv === 'err'; }), hasWarn = p.checks.some(function(c){ return c.lv === 'warn'; });
    st.hidden = false;
    st.className = 'status ' + (hasErr ? 'err' : hasWarn ? 'warn' : 'ok');
    st.textContent = u(hasErr ? 'errStatus' : hasWarn ? 'warnStatus' : 'okStatus');
    $('empty').hidden = true; $('out').hidden = false;

    // Summary
    var sum = [], mt = mtiText(p.mti);
    sum.push([u('sMsg'), p.mti, mt]);
    var amt = d.get(4);
    if (amt && /^\d+$/.test(amt.value)) sum.push([u('sAmount'), money(decStr(amt.value, 2), d.cur)]);
    var m43 = d.get(43);
    if (m43 && profile === 'qris' && m43.value.length === 40) sum.push([u('sMerchant'), m43.value.slice(0, 25).trim(), m43.value.slice(25, 38).trim()]);
    var rrn = d.get(37); if (rrn) sum.push([u('sRrn'), rrn.value]);
    if (rc) sum.push([u('sRc'), rc.value, RC[rc.value] ? tr(RC[rc.value]) : null]);
    sum.push([u('sFields'), String(p.fields.length)]);
    $('summary').innerHTML = sum.map(function(s){ return '<div><dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + (s[2] ? '<small>' + esc(s[2]) + '</small>' : '') + '</dd></div>'; }).join('');

    // Raw, colour-coded
    $('raw').innerHTML = p.segs.map(function(sg){
      if (sg.cls) return '<span class="' + sg.cls + '">' + esc(sg.text) + '</span>';
      return '<span class="seg" data-i="' + sg.i + '">' + (sg.pre ? '<span class="l">' + esc(sg.pre) + '</span>' : '') + '<span class="v' + (sg.i % 2) + '">' + esc(sg.text) + '</span></span>';
    }).join('') + (p.rest ? '<span class="bad">' + esc(p.rest) + '</span>' : '');

    // JSON
    $('json').innerHTML = serialize(d.entries, true);

    // Rows
    function rowHTML(r, i, child, depth){
      return '<li class="row' + (child ? ' child' : '') + (r.flag ? ' flag' : '') + '" data-i="' + i + '"' + (child ? ' style="--d:' + depth + '"' : '') + '>' +
        '<span class="tag">' + esc(r.tag) + '</span>' +
        '<span class="name">' + esc(tr(r.name)) + (r.fmt ? '<span class="fmt">' + esc(r.fmt) + '</span>' : '') + (r.key ? '<span class="key">→ ' + esc(r.key) + '</span>' : '') + '</span>' +
        '<span class="val">' + esc(r.rawValue != null ? r.rawValue : r.value) + (r.meaning ? '<span class="meaning">' + esc(tr(r.meaning)) + '</span>' : '') + '</span>' +
        '<span class="len">' + r.len + '</span></li>';
    }
    var html = '';
    d.rows.forEach(function(r){
      html += rowHTML(r, r.i, false, 0);
      r.kids.forEach(function(k){
        html += rowHTML(k, r.i, true, 1);
        (k.sub || []).forEach(function(s){ html += rowHTML(s, r.i, true, 2); });
      });
    });
    $('rows').innerHTML = html;

    var order = {err:0, warn:1, info:2, ok:3};
    $('checks').innerHTML = p.checks.slice().sort(function(a, b){ return order[a.lv] - order[b.lv]; })
      .map(function(c){ return '<li class="' + c.lv + '">' + esc(tr(c.msg)) + '</li>'; }).join('');
  }

  // Hover link between raw message and rows
  var hot = null;
  function setHot(id){
    if (hot === id) return;
    document.querySelectorAll('.hl').forEach(function(el){ el.classList.remove('hl'); });
    hot = id;
    if (id != null) document.querySelectorAll('[data-i="' + id + '"]').forEach(function(el){ el.classList.add('hl'); });
  }
  ['raw', 'rows'].forEach(function(box){
    $(box).addEventListener('mouseover', function(e){ var el = e.target.closest('[data-i]'); setHot(el ? el.getAttribute('data-i') : null); });
    $(box).addEventListener('mouseleave', function(){ setHot(null); });
  });
  $('raw').addEventListener('click', function(e){
    var el = e.target.closest('[data-i]');
    var row = el && document.querySelector('.row[data-i="' + el.getAttribute('data-i') + '"]');
    if (row) row.scrollIntoView({behavior:'smooth', block:'center'});
  });

  // ---------- Sample (fictional merchant and payer) ----------
  function pad(s, n){ while (s.length < n) s += ' '; return s.slice(0, n); }
  function t2(tag, v){ return tag + ('0' + v.length).slice(-2) + v; }
  function build(mti, f){
    var des = Object.keys(f).map(Number).sort(function(a, b){ return a - b; });
    var hasSec = des.some(function(x){ return x > 64; });
    var bits = new Array(128).fill(0); if (hasSec) bits[0] = 1;
    des.forEach(function(x){ bits[x - 1] = 1; });
    var hex = ''; for (var i = 0; i < (hasSec ? 128 : 64); i += 4) hex += (bits[i] * 8 + bits[i + 1] * 4 + bits[i + 2] * 2 + bits[i + 3]).toString(16).toUpperCase();
    var body = des.map(function(x){ var sp = spec(x, 'qris'), v = f[x]; return (sp.var ? ('00' + v.length).slice(-sp.var) : '') + v; }).join('');
    return mti + hex + body;
  }
  function two(n){ return ('0' + n).slice(-2); }
  function sample(){
    var now = new Date(), g = new Date(now.getTime() - 7 * 3600e3);
    var lmd = two(now.getMonth() + 1) + two(now.getDate()), hms = two(now.getHours()) + two(now.getMinutes()) + two(now.getSeconds());
    var gmt = two(g.getMonth() + 1) + two(g.getDate()) + two(g.getHours()) + two(g.getMinutes()) + two(g.getSeconds());
    return build('0200', {
      2: '9360099900000012345', 3: '266000', 4: '000002500000', 7: gmt, 11: '004217', 12: hms, 13: lmd, 15: lmd, 17: lmd,
      18: '5812', 22: '011', 28: 'C00000000', 32: '93600999', 33: '360099', 37: '000412345678', 38: 'A1B2C3',
      41: pad('KASIR01', 16), 42: '000000000012345', 43: pad('WARUNG CONTOH', 25) + pad('JAKARTA SELAT', 13) + 'ID',
      48: t2('PI', 'Q001') + t2('CD', pad('BUDI SANTOSO', 30)) + t2('MC', 'UMI'), 49: '360',
      57: t2('61', '12190') + t2('62', t2('01', 'INV-0001') + t2('07', 'KASIR01')),
      100: '93600888', 102: '9360088800001234567'
    });
  }

  // ---------- Wiring ----------
  function applyLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = u(el.getAttribute('data-t')); });
    q.placeholder = u('placeholder');
    $('year').placeholder = u('yearAuto');
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l)); });
    try { localStorage.setItem('iso8583-lang', l); } catch (e) {}
    render();
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); });
  });

  var root = document.documentElement;
  try { var t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
  $('theme').addEventListener('click', function(){
    var c = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = c === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  function setFmt(pr){
    pretty = pr;
    $('fmtMin').setAttribute('aria-pressed', String(!pr)); $('fmtPretty').setAttribute('aria-pressed', String(pr));
    try { localStorage.setItem('iso8583-pretty', pr ? '1' : '0'); } catch (e) {}
    render();
  }
  $('fmtMin').addEventListener('click', function(){ setFmt(false); });
  $('fmtPretty').addEventListener('click', function(){ setFmt(true); });

  q.addEventListener('input', render);
  $('profile').addEventListener('change', function(){ try { localStorage.setItem('iso8583-profile', this.value); } catch (e) {} render(); });
  $('year').addEventListener('input', render);
  $('sample').addEventListener('click', function(){ q.value = sample(); render(); });
  $('clear').addEventListener('click', function(){ q.value = ''; render(); q.focus(); });
  $('copy').addEventListener('click', function(){
    if (!current) return;
    var btn = this;
    navigator.clipboard.writeText(serialize(current.d.entries, false)).then(function(){
      btn.textContent = u('copied');
      setTimeout(function(){ btn.textContent = u('copyJson'); }, 1400);
    }, function(){});
  });

  try {
    var sp0 = localStorage.getItem('iso8583-profile'); if (sp0 === 'iso' || sp0 === 'qris') $('profile').value = sp0;
    if (localStorage.getItem('iso8583-pretty') === '1'){ pretty = true; $('fmtMin').setAttribute('aria-pressed', 'false'); $('fmtPretty').setAttribute('aria-pressed', 'true'); }
  } catch (e) {}
  var saved = null;
  try { saved = localStorage.getItem('iso8583-lang'); } catch (e) {}
  applyLang(saved || ((navigator.language || '').toLowerCase().indexOf('id') === 0 ? 'id' : 'en'));

  // Exposed for testing in the console
  window.iso8583 = { decode: function(s, profile){ var pr = profile || 'qris', p = parse(s, pr), d = decode(p, pr); return serialize(d.entries, false); } };
})();
</script>
